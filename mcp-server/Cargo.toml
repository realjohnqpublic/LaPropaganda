[package]
name = "mcp-server"
version = "0.1.0"
edition = "2021"
description = "MCP signing server for La Propaganda agentic authors and board members"

[dependencies]
# MCP SDK
rmcp = { version = "0.13", features = ["server", "transport-io", "schemars"] }
schemars = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Cryptography (same versions as xtask for compatibility)
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Shared core library
la-propaganda-core = { path = "../core" }

# SSH agent for hardware key signing
ssh-agent-client-rs = "0.2"
ssh-key = "0.5"
bytes = "1.0"

# Utilities
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"

[dev-dependencies]
tempfile = "3.24"
