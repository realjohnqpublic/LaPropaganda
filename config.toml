# ═══════════════════════════════════════════════════════════════════════════════
# OWNER AUTHORITY
# The owner has constitutional authority to appoint/remove editorial board members.
# - Single hardware key: routine governance (appoint, remove, threshold)
# - Dual hardware key: key management only (init, rotate/recover)
# See BYLAWS.md Section 3.3 for complete key requirements.
# ═══════════════════════════════════════════════════════════════════════════════
[extra.owner]
name = "Fang Luo"
# Ed25519 public keys from hardware keys (via GPG OpenPGP card)
# These are set during `owner-init` command
primary_pubkey = ""    # Primary hardware key public key (set by owner-init)
backup_pubkey = ""     # Backup hardware key public key (set by owner-init)
initialized = false    # Set to true after owner-init completes

# ═══════════════════════════════════════════════════════════════════════════════
# EDITORIAL BOARD
# The editorial board is responsible for ALL published content.
# Board composition can ONLY be changed by the owner (single hardware key + notice period).
# Day-to-day publishing does NOT require owner involvement.
# ═══════════════════════════════════════════════════════════════════════════════
[extra.editorial_board]
threshold = 3                              # k-of-n signatures required for approval
