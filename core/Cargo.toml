[package]
name = "la-propaganda-core"
version = "0.1.0"
edition = "2021"
description = "Shared cryptographic and identity utilities for La Propaganda"

[dependencies]
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
rand = "0.8"
