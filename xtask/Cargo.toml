[package]
name = "xtask"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
chrono = "0.4"
shlex = "1.0"
sha2 = "0.10"
hex = "0.4"
regex = "1.10"
walkdir = "2.4"
console = "0.15"
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
reqwest = { version = "0.12", features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9.11"
toml_edit = "0.22"
tempfile = "3.24.0"
